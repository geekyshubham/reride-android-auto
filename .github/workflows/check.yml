name: Host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/public_audit.py
      - run: python3 -m py_compile reride.py tools/build_managed.py
      - run: |
          mkdir -p build/testclasses
          javac -d build/testclasses android/kiosk/src/org/reride/headunit/GuardPolicy.java tests/GuardPolicyTest.java
          java -cp build/testclasses GuardPolicyTest
